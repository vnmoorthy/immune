<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" width="900" height="900" role="img" aria-labelledby="t d">
<title id="t">Immune — the seven-step remediation loop</title>
<desc id="d">Antigen → Antibody → Proof → Semgrep → Receipt → Ruling → Immunity, measured as time-to-immunity.</desc>
<style>
  .t{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:#e8e9eb}
  .m{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;fill:#e8e9eb}
  .lbl{font-size:12px;letter-spacing:.2em;fill:rgba(232,233,235,.68)}
  .h{font-size:14px;font-weight:600}
  .s{font-size:12px;fill:rgba(232,233,235,.62)}
  .big{font-size:13px;letter-spacing:.24em;fill:rgba(232,233,235,.7)}
  .val{font-size:30px;font-weight:600;letter-spacing:.02em}
  .box{fill:#0e1013;stroke:rgba(255,255,255,.25);stroke-width:1}
  .ln{fill:none;stroke:rgba(232,233,235,.75);stroke-width:1.25}
  .red{stroke:#e5484d}.grn{stroke:#3ecf8e}
  .hair{fill:none;stroke:rgba(255,255,255,.22);stroke-width:1}
</style>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e8e9eb"/></marker>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e5484d"/></marker>
  <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3ecf8e"/></marker>
</defs>
<rect width="900" height="900" fill="#0a0b0d"/>
<text x="36" y="40" class="m lbl">IMMUNE · THE LOOP</text>
<text x="864" y="40" class="m lbl" text-anchor="end">BREACH → ANTIBODY → RECEIPT → RULING → IMMUNE</text>
<line x1="36" y1="58" x2="864" y2="58" class="hair"/>
<circle cx="450" cy="450" r="300" class="hair" stroke-dasharray="2 6"/>
<path d="M546.3 165.9 A300 300 0 0 1 612.1 197.6" class="ln " marker-end="url(#a)"/>
<path d="M732.2 348.1 A300 300 0 0 1 748.4 419.4" class="ln " marker-end="url(#a)"/>
<path d="M705.6 607.1 A300 300 0 0 1 660.0 664.2" class="ln " marker-end="url(#a)"/>
<path d="M486.5 747.8 A300 300 0 0 1 413.5 747.8" class="ln " marker-end="url(#a)"/>
<path d="M240.0 664.2 A300 300 0 0 1 194.4 607.1" class="ln " marker-end="url(#a)"/>
<path d="M151.6 419.4 A300 300 0 0 1 167.8 348.1" class="ln " marker-end="url(#a)"/>
<path d="M287.9 197.6 A300 300 0 0 1 353.7 165.9" class="ln grn" marker-end="url(#ag)"/>
<rect x="362.5" y="111.5" width="176" height="78" class="box red"/>
<text x="374.0" y="133.0" class="m lbl">01 ANTIGEN</text>
<text x="374.0" y="155.0" class="t h">trace captured</text>
<text x="374.0" y="175.0" class="m s">replayable Trace</text>
<rect x="597.0" y="224.5" width="176" height="78" class="box"/>
<text x="608.5" y="246.0" class="m lbl">02 ANTIBODY</text>
<text x="608.5" y="268.0" class="t h">rule synthesized</text>
<text x="608.5" y="288.0" class="m s">synthesizeAntibody()</text>
<rect x="655.0" y="478.3" width="176" height="78" class="box"/>
<text x="666.5" y="499.8" class="m lbl">03 PROOF</text>
<text x="666.5" y="521.8" class="t h">replay vs corpus</text>
<text x="666.5" y="541.8" class="m s">prove(): catch↑ fp≤</text>
<rect x="492.7" y="681.8" width="176" height="78" class="box"/>
<text x="504.2" y="703.3" class="m lbl">04 SEMGREP</text>
<text x="504.2" y="725.3" class="t h">source rescan</text>
<text x="504.2" y="745.3" class="m s">semgrep --config …</text>
<rect x="232.3" y="681.8" width="176" height="78" class="box"/>
<text x="243.8" y="703.3" class="m lbl">05 RECEIPT</text>
<text x="243.8" y="725.3" class="t h">HMAC-SHA256</text>
<text x="243.8" y="745.3" class="m s">over sha256(proof)</text>
<rect x="70.0" y="478.3" width="176" height="78" class="box"/>
<text x="81.5" y="499.8" class="m lbl">06 RULING</text>
<text x="81.5" y="521.8" class="t h">precedent published</text>
<text x="81.5" y="541.8" class="m s">local · Senso</text>
<rect x="128.0" y="224.5" width="176" height="78" class="box grn"/>
<text x="139.5" y="246.0" class="m lbl">07 IMMUNITY</text>
<text x="139.5" y="268.0" class="t h">fresh session</text>
<text x="139.5" y="288.0" class="m s">same attack bounces</text>
<path d="M450 74 V108" class="ln red" marker-end="url(#ar)"/>
<text x="462" y="96" class="m s" style="fill:#e5484d">BREACH — attack ∧ allow</text>
<path d="M151 305 V360" class="ln grn" marker-end="url(#ag)"/>
<text x="36" y="398" class="m s" style="fill:#3ecf8e">next agent: denied with citation</text>
<rect x="300.5" y="376.5" width="300" height="148" class="box"/>
<text x="450" y="410" class="m big" text-anchor="middle">TIME TO IMMUNITY</text>
<text x="450" y="450" class="t val" text-anchor="middle">t(07) − t(breach)</text>
<text x="450" y="478" class="m s" text-anchor="middle">timeToImmunityMs, per remediation</text>
<text x="450" y="498" class="m s" text-anchor="middle">promoted only if the proof passes</text>
<text x="450" y="516" class="m s" text-anchor="middle">"done" refused without a receipt</text>
<line x1="36" y1="842" x2="864" y2="842" class="hair"/>
<text x="36" y="866" class="m lbl">EVERY ATTACK BECOMES AN ANTIBODY</text>
<text x="864" y="866" class="m lbl" text-anchor="end">ANTIGEN → ANTIBODY → RECEIPT → RULING → IMMUNE</text>
</svg>
