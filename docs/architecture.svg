<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-labelledby="t d">
  <title id="t">Immune — architecture</title>
  <desc id="d">Agent → Immune proxy (detectors, typed gate, quarantine, hash pins) → MCP servers; traces to ClickHouse; breach → remediator loop on Guild; rulings to Senso and cited back in denials; optional LLM refiner on AkashML; Next.js dashboard over SSE.</desc>
  <style>
    .t { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #e8e9eb; }
    .m { font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; fill: #e8e9eb; }
    .lbl { font-size: 12px; letter-spacing: 0.2em; fill: rgba(232,233,235,0.66); }
    .h { font-size: 17px; font-weight: 600; }
    .h2 { font-size: 15px; font-weight: 600; }
    .b { font-size: 14px; fill: rgba(232,233,235,0.86); }
    .b2 { font-size: 13px; fill: rgba(232,233,235,0.86); }
    .s { font-size: 12px; fill: rgba(232,233,235,0.64); }
    .s2 { font-size: 11.5px; fill: rgba(232,233,235,0.64); }
    .box { fill: #0e1013; stroke: rgba(255,255,255,0.25); stroke-width: 1; }
    .box2 { fill: #121418; stroke: rgba(255,255,255,0.2); stroke-width: 1; }
    .ln { fill: none; stroke: rgba(232,233,235,0.78); stroke-width: 1.25; }
    .lnd { fill: none; stroke: rgba(232,233,235,0.5); stroke-width: 1.25; stroke-dasharray: 5 5; }
    .red { stroke: #e5484d; } .grn { stroke: #3ecf8e; }
    .hair { fill: none; stroke: rgba(255,255,255,0.22); stroke-width: 1; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e8e9eb"/></marker>
    <marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="rgba(232,233,235,0.6)"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e5484d"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3ecf8e"/></marker>
  </defs>

  <rect width="1600" height="1000" fill="#0a0b0d"/>

  <!-- header -->
  <text x="48" y="40" class="m lbl">IMMUNE · ARCHITECTURE</text>
  <text x="1552" y="40" class="m lbl" text-anchor="end">MCP FIREWALL · REPLAY-PROVEN COUNTERMEASURES · SIGNED RECEIPTS · THE NEXT AGENT IS IMMUNE</text>
  <line x1="48" y1="58" x2="1552" y2="58" class="hair"/>

  <!-- ============ ROW 1 : the request path ============ -->

  <!-- AGENT -->
  <rect x="48.5" y="110.5" width="270" height="220" class="box"/>
  <text x="64" y="136" class="m lbl">AGENT · MCP CLIENT</text>
  <text x="64" y="166" class="t h">Claude Code · Cursor · any</text>
  <text x="64" y="194" class="t b">speaks MCP over stdio JSON-RPC</text>
  <text x="64" y="216" class="t b">list_tools → call_tool → results</text>
  <text x="64" y="238" class="t b">follows what it reads — which is</text>
  <text x="64" y="258" class="t b">exactly how it gets hijacked</text>
  <text x="64" y="296" class="m s">immune wrap --name acme -- &lt;srv&gt;</text>
  <text x="64" y="314" class="m s">client config → proxy binary</text>

  <!-- PROXY -->
  <rect x="390.5" y="90.5" width="560" height="380" class="box"/>
  <text x="406" y="116" class="m lbl">IMMUNE PROXY · APPS/PROXY</text>
  <text x="406" y="144" class="t h">In-line MCP firewall (stdio ⇄ stdio), one process per server</text>

  <rect x="406.5" y="160.5" width="236" height="150" class="box2"/>
  <text x="418" y="182" class="m lbl">DETECTORS</text>
  <text x="418" y="202" class="m s">poisoned_description</text>
  <text x="418" y="218" class="m s">result_injection</text>
  <text x="418" y="234" class="m s">secret_exfil</text>
  <text x="418" y="250" class="m s">rug_pull (hash pins)</text>
  <text x="418" y="266" class="m s">homoglyph</text>
  <text x="418" y="282" class="m s">destination (allowlist)</text>
  <text x="418" y="298" class="m s">taint_gate (session taint)</text>

  <rect x="654.5" y="160.5" width="280" height="150" class="box2"/>
  <text x="666" y="182" class="m lbl">TYPED GATE</text>
  <text x="666" y="202" class="m s">capability-typed calls:</text>
  <text x="666" y="218" class="m s">read·write·network·exec·secret</text>
  <text x="666" y="234" class="m s">allow · flag · block · quarantine</text>
  <text x="666" y="250" class="m s">quarantine &gt; block &gt; flag &gt; allow</text>
  <text x="666" y="266" class="m s">builtin + promoted antibodies</text>
  <text x="666" y="282" class="m s">deny ⇒ blockedBy + citation</text>
  <text x="666" y="298" class="m s">latency p50/p95 (performance.now)</text>

  <rect x="406.5" y="326.5" width="236" height="64" class="box2"/>
  <text x="418" y="348" class="m lbl">QUARANTINE</text>
  <text x="418" y="366" class="m s">drops poisoned or confusable</text>
  <text x="418" y="382" class="m s">tools · release via API</text>

  <rect x="654.5" y="326.5" width="280" height="64" class="box2"/>
  <text x="666" y="348" class="m lbl">HASH PINS</text>
  <text x="666" y="366" class="m s">sha256(name+description+schema)</text>
  <text x="666" y="382" class="m s">changed def ⇒ rug_pull ⇒ block</text>

  <text x="406" y="422" class="t b2">every step becomes a Trace — the Antigen (def · call · result, decision, findings, ms)</text>
  <text x="406" y="444" class="m s">ingest: POST /api/ingest {trace}   ·   rules: GET /api/rules every 10 s</text>

  <!-- MCP SERVERS -->
  <rect x="1030.5" y="110.5" width="270" height="220" class="box"/>
  <text x="1046" y="136" class="m lbl">MCP SERVERS · DOWNSTREAM</text>
  <text x="1046" y="166" class="t h">acme — the demo server</text>
  <text x="1046" y="192" class="m s">lookup_customer · fetch_url</text>
  <text x="1046" y="208" class="m s">read_shared_doc · run_report</text>
  <text x="1046" y="224" class="m s">send_webhook · update_profile</text>
  <text x="1046" y="240" class="m s">get_api_credentials</text>
  <text x="1046" y="268" class="t b">AI-generated: real fetch/exec</text>
  <text x="1046" y="288" class="t b">sinks, unguarded (Semgrep target)</text>
  <text x="1046" y="314" class="m s">+ filesystem · github · http · …</text>

  <!-- row-1 arrows -->
  <path d="M318 190 H390" class="ln" marker-end="url(#a)"/>
  <text x="354" y="180" class="m s2" text-anchor="middle">call →</text>
  <path d="M390 250 H318" class="ln" marker-end="url(#a)"/>
  <text x="354" y="268" class="m s2" text-anchor="middle">← verdict</text>
  <text x="354" y="283" class="m s2" text-anchor="middle">cited</text>

  <path d="M950 190 H1030" class="ln" marker-end="url(#a)"/>
  <text x="990" y="180" class="m s2" text-anchor="middle">→ call</text>
  <path d="M1030 250 H950" class="ln" marker-end="url(#a)"/>
  <text x="990" y="268" class="m s2" text-anchor="middle">← result</text>
  <text x="990" y="283" class="m s2" text-anchor="middle">inspected</text>

  <!-- ============ ROW 2 : engine, store, loop ============ -->

  <!-- CLICKHOUSE -->
  <rect x="48.5" y="540.5" width="290" height="180" class="box"/>
  <text x="64" y="566" class="m lbl">CLICKHOUSE</text>
  <text x="64" y="594" class="t h">traces — the replay corpus</text>
  <text x="64" y="620" class="m s">traces · MergeTree · ORDER BY ts,id</text>
  <text x="64" y="636" class="m s">JSON as String · batched inserts</text>
  <text x="64" y="652" class="m s">named queries: families · timeline</text>
  <text x="64" y="668" class="m s">top_destinations · latency</text>
  <text x="64" y="692" class="t b">10k – 100k rows via /api/flood</text>
  <text x="64" y="710" class="t b">every query timed → storeMs in proof</text>

  <!-- ENGINE -->
  <rect x="390.5" y="540.5" width="560" height="130" class="box"/>
  <text x="406" y="566" class="m lbl">IMMUNE ENGINE · APPS/WEB/SERVER/ENGINE.TS</text>
  <text x="406" y="594" class="t h">Gate + rules · EventBus (SSE) · Remediator · Quarantine · Metrics</text>
  <text x="406" y="620" class="m s">store: ClickHouse if it pings, else memory (truthful in /api/status)</text>
  <text x="406" y="636" class="m s">api: attack · flood · traces · rules · remediate · receipts · rulings</text>
  <text x="406" y="656" class="m s">breach (attack ∧ allow) ⇒ auto-remediate; every step is an ImmuneEvent</text>

  <!-- DASHBOARD -->
  <rect x="48.5" y="790.5" width="290" height="150" class="box"/>
  <text x="64" y="816" class="m lbl">DASHBOARD · NEXT.JS</text>
  <text x="64" y="844" class="t h">command center</text>
  <text x="64" y="868" class="m s">arena · live wire · theatre</text>
  <text x="64" y="884" class="m s">/antibodies · /receipts · /rulings</text>
  <text x="64" y="900" class="m s">/traces · /data · TTI · catch · FP</text>
  <text x="64" y="924" class="m s">SSE /api/events · heartbeat 10 s</text>

  <!-- REMEDIATOR LOOP -->
  <rect x="390.5" y="720.5" width="910" height="220" class="box"/>
  <text x="406" y="746" class="m lbl">REMEDIATOR LOOP · HOSTED ON GUILD · IN-PROCESS WHEN GUILD_TRIGGER_URL IS UNSET</text>

  <rect x="406.5" y="770.5" width="120" height="84" class="box2 red"/>
  <text x="414" y="792" class="m lbl">01 ANTIGEN</text>
  <text x="414" y="814" class="t b2">trace captured</text>
  <text x="414" y="834" class="m s2">replayable JSON</text>

  <rect x="532.5" y="770.5" width="120" height="84" class="box2"/>
  <text x="540" y="792" class="m lbl">02 ANTIBODY</text>
  <text x="540" y="814" class="t b2">rule synthesized</text>
  <text x="540" y="834" class="m s2">tokens · taint</text>

  <rect x="658.5" y="770.5" width="120" height="84" class="box2"/>
  <text x="666" y="792" class="m lbl">03 PROOF</text>
  <text x="666" y="814" class="t b2">replay vs corpus</text>
  <text x="666" y="834" class="m s2">catch↑ ∧ fp≤</text>

  <rect x="784.5" y="770.5" width="120" height="84" class="box2"/>
  <text x="792" y="792" class="m lbl">04 SEMGREP</text>
  <text x="792" y="814" class="t b2">source rescan</text>
  <text x="792" y="834" class="m s2">same YAML rule</text>

  <rect x="910.5" y="770.5" width="120" height="84" class="box2"/>
  <text x="918" y="792" class="m lbl">05 RECEIPT</text>
  <text x="918" y="814" class="t b2">HMAC-SHA256</text>
  <text x="918" y="834" class="m s2">over proof hash</text>

  <rect x="1036.5" y="770.5" width="120" height="84" class="box2"/>
  <text x="1044" y="792" class="m lbl">06 RULING</text>
  <text x="1044" y="814" class="t b2">precedent</text>
  <text x="1044" y="834" class="m s2">local · Senso</text>

  <rect x="1162.5" y="770.5" width="120" height="84" class="box2 grn"/>
  <text x="1170" y="792" class="m lbl">07 IMMUNITY</text>
  <text x="1170" y="814" class="t b2">fresh replay</text>
  <text x="1170" y="834" class="m s2">must be blocked</text>

  <path d="M526 812 H532" class="ln" marker-end="url(#a)"/>
  <path d="M652 812 H658" class="ln" marker-end="url(#a)"/>
  <path d="M778 812 H784" class="ln" marker-end="url(#a)"/>
  <path d="M904 812 H910" class="ln" marker-end="url(#a)"/>
  <path d="M1030 812 H1036" class="ln" marker-end="url(#a)"/>
  <path d="M1156 812 H1162" class="ln" marker-end="url(#a)"/>

  <text x="406" y="882" class="m s">promoted ⇔ targetCaught ∧ catchRate↑ ∧ fpRate≤    ·    timeToImmunityMs = t(07) − t(breach)</text>
  <text x="406" y="902" class="m s">Guild: POST …/workspaces/{owner}/{ws}/sessions {session_type: api_trigger, agent_input: {trace}} → poll</text>
  <text x="406" y="922" class="m s">"done" is refused without a receipt · an LLM draft is just another candidate for 03 PROOF</text>

  <!-- SENSO -->
  <rect x="1320.5" y="540.5" width="232" height="170" class="box"/>
  <text x="1336" y="566" class="m lbl">SENSO</text>
  <text x="1336" y="592" class="t h2">verified context (CLI)</text>
  <text x="1336" y="614" class="t b2">rulings as versioned docs,</text>
  <text x="1336" y="632" class="t b2">scoped search cites precedent</text>
  <text x="1336" y="656" class="m s2">senso kb create-raw (ruling)</text>
  <text x="1336" y="672" class="m s2">senso search → precedent</text>
  <text x="1336" y="688" class="m s2">+ kb_node_id · versions</text>
  <text x="1336" y="704" class="m s2">no key → .immune/rulings/</text>

  <!-- AKASHML -->
  <rect x="1320.5" y="760.5" width="232" height="180" class="box"/>
  <text x="1336" y="786" class="m lbl">LLM REFINER</text>
  <text x="1336" y="812" class="t h2">optional · AkashML</text>
  <text x="1336" y="836" class="m s2">api.akashml.com/v1 (OpenAI API)</text>
  <text x="1336" y="852" class="m s2">Bearer akml-… · JSON mode</text>
  <text x="1336" y="878" class="t b2">drafts a more general antibody</text>
  <text x="1336" y="896" class="t b2">and a plain-English ruling</text>
  <text x="1336" y="922" class="m s2">untrusted: 03 PROOF decides</text>

  <!-- row-2 arrows -->
  <path d="M560 470 V540" class="ln" marker-end="url(#a)"/>
  <text x="572" y="510" class="m s">POST /api/ingest {trace}</text>
  <path d="M780 540 V470" class="ln" marker-end="url(#a)"/>
  <text x="792" y="510" class="m s">GET /api/rules → promoted antibodies</text>

  <path d="M390 590 H338" class="ln" marker-end="url(#a)"/>
  <text x="364" y="580" class="m s2" text-anchor="middle">insert</text>
  <path d="M338 640 H390" class="ln" marker-end="url(#a)"/>
  <text x="364" y="631" class="m s2" text-anchor="middle">corpus()</text>

  <path d="M560 670 V720" class="ln red" marker-end="url(#ar)"/>
  <text x="572" y="700" class="m s" style="fill:#e5484d">BREACH ⇒ remediate</text>
  <path d="M780 720 V670" class="ln grn" marker-end="url(#ag)"/>
  <text x="792" y="700" class="m s" style="fill:#3ecf8e">rule · receipt · ruling → gate</text>

  <path d="M390 656 H364 V760 H193 V790" class="ln" marker-end="url(#a)"/>
  <text x="278" y="754" class="m s" text-anchor="middle">SSE /api/events</text>

  <path d="M1096 770 V690 H1320" class="ln grn" marker-end="url(#ag)"/>
  <text x="1108" y="684" class="m s" style="fill:#3ecf8e">publishRuling()</text>

  <path d="M1320 560 H1308 V420 H950" class="ln grn" marker-end="url(#ag)"/>
  <text x="1130" y="412" class="m s" text-anchor="middle" style="fill:#3ecf8e">fetchRulings() → citation in the denial</text>

  <path d="M1320 866 H1300" class="lnd" marker-end="url(#ad)"/>

  <!-- legend -->
  <line x1="48" y1="958" x2="1552" y2="958" class="hair"/>
  <text x="48" y="982" class="m lbl">LEGEND</text>
  <path d="M130 977 H170" class="ln" marker-end="url(#a)"/><text x="180" y="982" class="m s">MCP / API traffic</text>
  <path d="M330 977 H370" class="lnd" marker-end="url(#ad)"/><text x="380" y="982" class="m s">optional</text>
  <path d="M470 977 H510" class="ln red" marker-end="url(#ar)"/><text x="520" y="982" class="m s">breach (attack allowed)</text>
  <path d="M720 977 H760" class="ln grn" marker-end="url(#ag)"/><text x="770" y="982" class="m s">immune · promoted · cited</text>
  <rect x="990.5" y="968.5" width="16" height="16" class="box2"/><text x="1016" y="982" class="m s">component</text>
  <text x="1552" y="982" class="m lbl" text-anchor="end">ZERO-KEY · SPONSORS LIGHT UP WHEN CONFIGURED</text>
</svg>
